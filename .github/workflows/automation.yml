name: Tour Booking Automation

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in DRY RUN mode?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  process_emails:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Gmail Token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          python -c '
          import os
          import json
          token_content = os.environ.get("GMAIL_TOKEN_JSON")
          if token_content:
              with open("token_new.json", "w", encoding="utf-8") as f:
                  f.write(token_content)
          '

      - name: Run Automation
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          ENABLE_AIRTABLE: ${{ secrets.ENABLE_AIRTABLE || 'true' }}
          ENABLE_BASEROW: ${{ secrets.ENABLE_BASEROW || 'true' }}
          BASEROW_URL: ${{ secrets.BASEROW_URL || 'https://booking.tourcare.ai' }}
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          BASEROW_TABLE_ID: ${{ secrets.BASEROW_TABLE_ID || '1194' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_QUERY: "label:GYG-Booking newer_than:1d -label:BOOKING_PROCESSED -label:BOOKING_IGNORED"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            export DRY_RUN="false"
            TRIGGER="schedule"
          else
            export DRY_RUN="${{ github.event.inputs.dry_run }}"
            TRIGGER="workflow_dispatch"
          fi
          echo "Trigger: $TRIGGER"
          echo "DRY RUN: $DRY_RUN"
          python run.py
