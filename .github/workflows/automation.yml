name: Tour Booking Automation

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 15 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in DRY RUN mode?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  process_emails:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Gmail Token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          echo "$GMAIL_TOKEN_JSON" > token.json

      - name: Run Automation
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          GMAIL_QUERY: "in:inbox -label:BOOKING_PROCESSED -label:BOOKING_IGNORED"
          # Use input for manual runs, default to 'true' for scheduled runs for safety for now
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          python run.py
